spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

rate-limit:
  capacity: 10
  refill-tokens: 10
  refill-duration-minutes: 1

outbox:
  cleanup:
    cron: "0 0 2 * * *"
    retention-days: 7
    batch-size: 1000

kms:
  enabled: ${KMS_ENABLED}
  region: ${AWS_REGION}
  key-id: ${AWS_KMS_KEY_ID}
  endpoint-override: ${AWS_KMS_ENDPOINT}

mock-pg:
  base-url: ${MOCK_PG_BASE_URL:http://localhost:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
