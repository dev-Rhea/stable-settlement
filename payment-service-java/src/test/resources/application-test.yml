spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: never

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

jwt:
  secret: test-secret-key-for-jwt-that-is-at-least-256-bits-long-for-hmac-sha
  expiration-ms: 3600000

rate-limit:
  capacity: 10
  refill-tokens: 10
  refill-duration-minutes: 1

outbox:
  cleanup:
    cron: "0 0 2 * * *"
    retention-days: 7
    batch-size: 1000
mock-pg:
  base-url: http://localhost:8081
  connect-timeout-ms: 2000
  read-timeout-ms: 3000
pg:
  reconcile:
    fixed-delay-ms: 3600000
    inquiry-after-seconds: 30
    give-up-after-seconds: 300

# 통합 테스트는 KMS 없이 실행한다(NoOp 서명기 사용). 이 값이 없으면 메인 설정의
# ${KMS_ENABLED} 등이 환경 변수에 의존해, .env 없이 실행하면 컨텍스트가 뜨지 않는다.
kms:
  enabled: false
  region: ap-northeast-2
  key-id: unused-in-test
  endpoint-override: http://localhost:4566
