services:
  mysql:
    image: mysql:8.0
    container_name: stable-settlement-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stable_settlement}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: stable-settlement-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    read_only: true
    tmpfs:
      - /data
    networks:
      - cache
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    container_name: stable-settlement-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "127.0.0.1:9092:9092"
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack:3.6
    container_name: stable-settlement-localstack
    environment:
      SERVICES: kms
      AWS_DEFAULT_REGION: ap-northeast-2
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./scripts/init-kms.sh:/etc/localstack/init/ready.d/init-kms.sh:ro
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "awslocal kms list-keys"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: payment-service-java/Dockerfile
    container_name: stable-settlement-payment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
        mock-pg-server:
          condition: service_started
    environment:
      # NOTE: useSSL=false is for local Docker network only. Production MUST use SSL.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-stable_settlement}?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KMS_ENABLED: "true"
      AWS_REGION: ap-northeast-2
      AWS_KMS_KEY_ID: alias/stable-settlement-key
      AWS_KMS_ENDPOINT: http://localstack:4566
      MOCK_PG_BASE_URL: http://mock-pg-server:8081
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - data
      - cache
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
    restart: on-failure

  mock-pg-server:
    build:
      context: .
      dockerfile: mock-pg-server/Dockerfile
    container_name: stable-settlement-mock-pg
    environment:
      PAYMENT_SERVICE_CALLBACK_URL: http://payment-servie:8000/internal/pg-callback
    ports:
      - "127.0.0.1:8081:8001"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: on-failure

  settlement-processor:
    build: ./settlement-processor-python
    container_name: stable-settlement-processor
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-stable_settlement}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KMS_ENABLED: "true"
      AWS_REGION: ap-northeast-2
      AWS_KMS_KEY_ID: alias/stable-settlement-key
      AWS_ENDPOINT_URL: http://localstack:4566
      # LocalStack dummy credentials (not real AWS keys)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    restart: on-failure

volumes:
  mysql-data:

networks:
  data:
    driver: bridge
  cache:
    driver: bridge
